<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; max-width: 600px; margin: 0 auto; border: 1px solid #e1e4e8; border-radius: 8px; overflow: hidden; }
        .header { background-color: #1a73e8; color: white; padding: 20px; text-align: center; }
        .content { padding: 30px; line-height: 1.6; color: #333; }
        .code { font-size: 32px; font-weight: bold; color: #1a73e8; text-align: center; letter-spacing: 5px; margin: 20px 0; }
        .footer { background-color: #f6f8fa; color: #586069; padding: 15px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{{ site_name }}</h2>
        </div>
        <div class="content">
            <p>您好！</p>
            <p>您正在进行<strong>{{ action_name }}</strong>操作。</p>
            <p>您的验证码如下：</p>
            <div class="code">{{ code }}</div>
            <p>该验证码在 5 分钟内有效。如非本人操作，请忽略此邮件。</p>
        </div>
        <div class="footer">
            © yodragon | 河南工业大学
        </div>
    </div>
</body>
</html>
